<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excuse Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="first-section d-flex justify-content-center">
        <div class="container">
            <div class="d-flex justify-content-center">
                <section>
                    <div class="box">
                      <h1 class="titulo d-flex justify-content-center">Tu propia excusa!</h1>
                        <p class="fs-4 m-3 p-3 d-flex justify-content-center">TU ME CREASTE! Y AHORA ESTOY DEBAJO!</p>
                <p class="d-flex justify-content-center" id="excuse">Tu propia excusa estará aquí!</p>
            </div>
        </div>
    </section>

    <section class="first-section d-flex justify-content-center my-2">
      <div class="container">
          <div class="d-flex justify-content-center">
              <section>
                  <div class="box">
                    <h1 class="titulo d-flex justify-content-center">Tus excusas anteriores</h1>
                      <p class="fs-4 m-3 p-3 d-flex justify-content-center">Para que no repitas tus excusas!</p>
              <p class="d-flex justify-content-center d-flex justify-content-center" id="excuses">Todas tus excusas anteriores se mostraran aquí! (bueno, solo las ultimas 5)</p>
          </div>
      </div>
  </section>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
